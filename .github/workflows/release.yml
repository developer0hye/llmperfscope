name: release

# Pull requests check that the package builds and works once installed. To publish, run this workflow by hand on a version tag:
#   gh workflow run release.yml --ref v0.1.0 -f publish=true
on:
  pull_request:
    paths:
      - pyproject.toml
      - MANIFEST.in
      - README.md
      - src/**
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to PyPI. Run it on a version tag."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build the source archive and the wheel
        run: |
          python -m pip install "build==1.6.1" "twine==7.0.0"
          python -m build
          python -m twine check --strict dist/*
      - name: Check what they hold
        run: |
          python -m zipfile -l dist/*.whl | grep -q "llmperfscope/native/cpuprof.c"
          tar tzf dist/*.tar.gz | grep -q "src/llmperfscope/native/cpuprof.c"
          tar tzf dist/*.tar.gz | grep -q "tests/test_runs.py"
          ! tar tzf dist/*.tar.gz | grep -q "sample-runs"
      - name: The tests in the source archive pass from it alone
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/unpacked" --strip-components=1
          cd "$RUNNER_TEMP/unpacked/tests"
          python -m unittest test_parsers test_html test_samples
      - name: A version tag has to match the package
        if: github.ref_type == 'tag'
        run: test -f "dist/llmperfscope-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - name: Use the installed wheel, away from the source tree
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl "matplotlib==3.11.2"
          cd "$RUNNER_TEMP"
          scope="$RUNNER_TEMP/venv/bin/llmperfscope"
          "$scope" --version
          "$scope" check
          "$scope" show "$GITHUB_WORKSPACE/examples/sample-runs/cpu-ram-limited" > /dev/null
          "$scope" figure "$GITHUB_WORKSPACE/examples/sample-runs/cpu-ram-limited" --kind lifecycle --out figures
          test -s figures/lifecycle.pdf
          "$scope" run --quiet --out plain -- python3 -c "print('hello')"
          test -s plain/report.html
          "$scope" run --quiet --cpu-profile --out sampled -- python3 -c "print(sum(range(30000000)))"
          python3 -c "import json; assert json.load(open('sampled/run.json'))['cpu_profile']['samples'] > 0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/llmperfscope/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions
          path: dist
      - name: Publish the files just tested, with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
